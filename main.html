<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sharable URLs</title>
</head>
<body>

  <form id="myForm">
    <input type="text" id="name" name="name" placeholder="Name">
    <input type="number" id="year" name="year" placeholder="Year">
    <button type="submit" id="button">Submit</button>
  </form>

  <h3 id="url">https://localhost:8080/</h3>

  <script>
    const form = document.getElementById('myForm');
    const nameInput = document.getElementById('name');
    const yearInput = document.getElementById('year');
    const urlHeading = document.getElementById('url');
    const baseUrl = 'https://localhost:8080/';

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const params = [];

      // Add name only if it has a value
      if (nameInput.value.trim() !== '') {
        params.push('name=' + encodeURIComponent(nameInput.value.trim()));
      }

      // Add year only if it has a value
      if (yearInput.value.trim() !== '') {
        params.push('year=' + encodeURIComponent(yearInput.value.trim()));
      }

      // Build the query string
      const queryString = params.length > 0 ? '?' + params.join('&') : '';

      urlHeading.textContent = baseUrl + queryString;
    });
  </script>

</body>
</html>
